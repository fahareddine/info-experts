<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client - Info Experts Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root{--bg:#f8fafc;--panel:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--brand:#1e3a8a;--brand2:#2563eb}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eff6ff 0%,var(--bg) 200px);color:var(--text)}
    .shell{max-width:1280px;margin:0 auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    .panel{padding:20px;margin-bottom:20px}.topbar,.toolbar,.grid{display:flex;gap:16px;flex-wrap:wrap}.topbar{justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .title{font-size:30px;font-weight:800;color:var(--brand)} .muted{color:var(--muted)} .pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800}
    input,select,textarea,button{font:inherit} input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)} textarea{min-height:120px;resize:vertical}
    button{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer} button.secondary{background:#e2e8f0;color:#0f172a}
    table{width:100%;border-collapse:collapse} th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px} th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
    .inline-link{color:var(--brand2);text-decoration:none;font-weight:700}.inline-link:hover{text-decoration:underline}.error,.success{padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;display:none}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:#f8fafc;text-align:center}.test{display:inline-flex;padding:2px 8px;border-radius:999px;background:#fee2e2;color:#b91c1c;font-size:11px;font-weight:800;margin-left:8px}
    @media(max-width:980px){.grid{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <div id="pageTitle" class="title">Client</div>
        <div id="pageSubtitle" class="muted">Chargement...</div>
      </div>
      <div class="toolbar">
        <a class="inline-link" href="/admin">Dashboard</a>
        <a class="inline-link" href="/admin/customers">Clients</a>
        <a class="inline-link" href="/admin/accounting">Comptabilité</a>
        <span id="roleBadge" class="pill">manager</span>
      </div>
    </div>

    <div id="globalSuccess" class="success"></div>
    <div id="globalError" class="error"></div>

    <div class="grid">
      <section class="card panel">
        <h3>Profil client</h3>
        <div id="profileWrap"></div>
      </section>

      <section class="card panel">
        <h3>Gestion du profil</h3>
        <div style="display:grid;gap:12px">
          <select id="statusInput">
            <option value="lead">Lead</option>
            <option value="active">Active</option>
            <option value="vip">VIP</option>
            <option value="blocked">Blocked</option>
            <option value="test">Test</option>
          </select>
          <input id="tagsInput" type="text" placeholder="Tags séparés par des virgules" maxlength="500">
          <textarea id="notesInput" placeholder="Notes internes sur ce client" maxlength="5000"></textarea>
          <div class="toolbar">
            <button id="saveProfileButton" type="button">Enregistrer le profil</button>
          </div>
        </div>
      </section>
    </div>

    <section class="card panel">
      <h3>Historique rendez-vous</h3>
      <div id="appointmentsWrap"></div>
    </section>

    <section class="card panel">
      <h3>Historique commandes</h3>
      <div id="ordersWrap"></div>
    </section>

    <section class="card panel">
      <h3>Historique paiements</h3>
      <div id="paymentsWrap"></div>
    </section>

    <section class="card panel">
      <h3>Journal d'échanges</h3>
      <div style="display:grid;gap:12px;margin-bottom:16px">
        <div class="grid">
          <select id="interactionChannelInput">
            <option value="phone">Téléphone</option>
            <option value="email">Email</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="admin">Interne</option>
            <option value="system">Système</option>
          </select>
          <select id="interactionDirectionInput">
            <option value="outbound">Sortant</option>
            <option value="inbound">Entrant</option>
            <option value="internal">Interne</option>
          </select>
        </div>
        <input id="interactionSummaryInput" type="text" placeholder="Résumé de l'échange" maxlength="200">
        <textarea id="interactionContentInput" placeholder="Détail de l'échange, décision prise, prochain suivi..." maxlength="5000"></textarea>
        <div class="toolbar">
          <button id="saveInteractionButton" type="button">Ajouter un échange</button>
        </div>
      </div>
      <div id="interactionsWrap"></div>
    </section>

    <section class="card panel">
      <h3>Timeline client</h3>
      <div id="timelineWrap"></div>
    </section>
  </div>

  <script>
    const key = new URLSearchParams(window.location.search).get('key');
    const successBox = document.getElementById('globalSuccess');
    const errorBox = document.getElementById('globalError');
    let currentRole = 'manager';
    let currentCustomer = null;

    function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function showMessage(el, message) { el.textContent = message; el.style.display = message ? 'block' : 'none'; }
    function clearMessages() { showMessage(successBox, ''); showMessage(errorBox, ''); }
    function renderEmpty(target, text) { target.innerHTML = '<div class="empty">' + text + '</div>'; }
    function fmtDate(value) { if (!value) return '—'; try { return new Date(value).toLocaleString('fr-FR', { dateStyle:'short', timeStyle:'short' }); } catch (_) { return value; } }
    function fmtAmount(value) { return Number(value || 0).toLocaleString('fr-FR') + ' KMF'; }
    function badge(text) { return '<span class="pill">' + text + '</span>'; }
    function detailEntityPath(entityType) { return entityType === 'appointment' ? 'appointments' : entityType === 'order' ? 'orders' : entityType === 'payment' ? 'payments' : 'customers'; }

    async function request(url, options = {}) {
      const response = await fetch(url, { credentials:'include', headers:{ 'Content-Type':'application/json', ...(options.headers || {}) }, ...options });
      let data = null; try { data = await response.json(); } catch (_) {}
      if (!response.ok) throw new Error(data && data.error ? data.error : 'Erreur serveur');
      return data;
    }

    function renderTable(target, rows, columns) {
      if (!rows || !rows.length) return renderEmpty(target, 'Aucune donnée.');
      target.innerHTML = '<table><thead><tr>' + columns.map((col) => '<th>' + col.label + '</th>').join('') + '</tr></thead><tbody>'
        + rows.map((row) => '<tr>' + columns.map((col) => '<td>' + (col.render ? col.render(row) : esc(row[col.key] || '—')) + '</td>').join('') + '</tr>').join('')
        + '</tbody></table>';
    }

    async function load() {
      clearMessages();
      if (!key) throw new Error('Clé client manquante.');
      const session = await request('/api/admin/auth?action=session', { method:'GET' });
      currentRole = session.role || 'manager';
      document.getElementById('roleBadge').textContent = currentRole;
      const data = await request('/api/admin/detail?entity=customers&reference=' + encodeURIComponent(key), { method:'GET' });
      currentCustomer = data.record;
      document.getElementById('pageTitle').innerHTML = currentCustomer.display_name + (currentCustomer.is_test ? '<span class="test">TEST</span>' : '');
      document.getElementById('pageSubtitle').textContent = currentCustomer.customer_key;
      document.getElementById('statusInput').value = currentCustomer.lifecycle_status;
      document.getElementById('tagsInput').value = (currentCustomer.tags || []).join(', ');
      document.getElementById('notesInput').value = currentCustomer.notes || '';
      document.getElementById('saveProfileButton').style.display = currentRole === 'manager' ? 'inline-flex' : 'none';
      document.getElementById('saveInteractionButton').style.display = currentRole === 'manager' ? 'inline-flex' : 'none';

      document.getElementById('profileWrap').innerHTML = '<table><tbody>'
        + '<tr><th>Clé client</th><td>' + currentCustomer.customer_key + '</td></tr>'
        + '<tr><th>Email</th><td>' + (currentCustomer.email || '—') + '</td></tr>'
        + '<tr><th>Téléphone</th><td>' + (currentCustomer.phone || '—') + '</td></tr>'
        + '<tr><th>Statut</th><td>' + badge(currentCustomer.lifecycle_status) + '</td></tr>'
        + '<tr><th>Commandes</th><td>' + (currentCustomer.orders_count || 0) + '</td></tr>'
        + '<tr><th>Rendez-vous</th><td>' + (currentCustomer.appointments_count || 0) + '</td></tr>'
        + '<tr><th>Paiements</th><td>' + (currentCustomer.payments_count || 0) + '</td></tr>'
        + '<tr><th>Dernière activité</th><td>' + fmtDate(currentCustomer.last_seen_at) + '</td></tr>'
        + '</tbody></table>';

      renderTable(document.getElementById('appointmentsWrap'), data.customerData && data.customerData.appointments, [
        { label:'Référence', render: row => '<a class="inline-link" href="/admin/detail?entity=appointments&reference=' + encodeURIComponent(row.reference) + '">' + row.reference + '</a>' },
        { label:'Service', key:'service_name' },
        { label:'Date', render: row => row.appointment_date + ' ' + String(row.appointment_time || '').slice(0,5) },
        { label:'Statut', key:'status' }
      ]);
      renderTable(document.getElementById('ordersWrap'), data.customerData && data.customerData.orders, [
        { label:'Référence', render: row => '<a class="inline-link" href="/admin/detail?entity=orders&reference=' + encodeURIComponent(row.reference) + '">' + row.reference + '</a>' },
        { label:'Produit', key:'product_name' },
        { label:'Montant', render: row => fmtAmount(row.amount_kmf) },
        { label:'Statut', key:'status' }
      ]);
      renderTable(document.getElementById('paymentsWrap'), data.customerData && data.customerData.payments, [
        { label:'Référence', render: row => '<a class="inline-link" href="/admin/detail?entity=payments&reference=' + encodeURIComponent(row.reference) + '">' + row.reference + '</a>' },
        { label:'Objet', key:'label' },
        { label:'Montant', render: row => fmtAmount(row.amount_kmf) },
        { label:'Statut', key:'status' }
      ]);
      renderTable(document.getElementById('interactionsWrap'), data.customerData && data.customerData.interactions, [
        { label:'Date', render: row => fmtDate(row.createdAt) },
        { label:'Canal', key:'channel' },
        { label:'Sens', key:'direction' },
        { label:'Résumé', key:'summary' },
        { label:'Contenu', render: row => row.content || '—' },
        { label:'Lié à', render: row => row.relatedEntityReference ? '<a class="inline-link" href="/admin/detail?entity=' + encodeURIComponent(detailEntityPath(row.relatedEntityType)) + '&reference=' + encodeURIComponent(row.relatedEntityReference) + '">' + row.relatedEntityReference + '</a>' : '—' }
      ]);
      renderTable(document.getElementById('timelineWrap'), data.timeline, [
        { label:'Date', render: row => fmtDate(row.created_at) },
        { label:'Action', key:'action' },
        { label:'Transition', render: row => (row.from_status || '—') + ' → ' + (row.to_status || '—') },
        { label:'Note', key:'note' }
      ]);
    }

    async function saveProfile() {
      return request('/api/admin/actions?entity=customer', {
        method:'POST',
        body: JSON.stringify({
          customerKey: key,
          lifecycleStatus: document.getElementById('statusInput').value,
          tags: document.getElementById('tagsInput').value,
          notes: document.getElementById('notesInput').value
        })
      });
    }

    async function saveInteraction() {
      return request('/api/admin/actions?entity=customerInteraction', {
        method:'POST',
        body: JSON.stringify({
          customerKey: key,
          channel: document.getElementById('interactionChannelInput').value,
          direction: document.getElementById('interactionDirectionInput').value,
          summary: document.getElementById('interactionSummaryInput').value,
          content: document.getElementById('interactionContentInput').value
        })
      });
    }

    document.getElementById('saveProfileButton').addEventListener('click', async () => {
      try {
        await saveProfile();
        await load();
        showMessage(successBox, 'Profil client mis à jour.');
      } catch (error) {
        showMessage(errorBox, error.message || 'Mise à jour impossible.');
      }
    });

    document.getElementById('saveInteractionButton').addEventListener('click', async () => {
      const summary = document.getElementById('interactionSummaryInput').value.trim();
      if (!summary) { showMessage(errorBox, 'Le résumé de l\'échange est requis.'); return; }
      try {
        await saveInteraction();
        document.getElementById('interactionSummaryInput').value = '';
        document.getElementById('interactionContentInput').value = '';
        await load();
        showMessage(successBox, 'Échange client ajouté.');
      } catch (error) {
        showMessage(errorBox, error.message || 'Ajout impossible.');
      }
    });

    load().catch((error) => showMessage(errorBox, error.message || 'Chargement impossible.'));
  </script>
</body>
</html>
