<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients — Info Experts Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #f8fafc; --panel: #fff; --line: #e2e8f0;
      --text: #0f172a; --muted: #64748b;
      --brand: #1e3a8a; --brand2: #2563eb;
      --green: #16a34a; --red: #dc2626; --amber: #d97706;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: linear-gradient(180deg,#eff6ff 0%,var(--bg) 180px); color: var(--text); }
    .shell { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .brand { font-size: 26px; font-weight: 800; color: var(--brand); }
    .brand span { color: #60a5fa; }
    .muted { color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 20px rgba(15,23,42,.05); }
    .panel { padding: 20px; margin-bottom: 18px; }
    input, select, button, textarea { font: inherit; }
    input[type=text], input[type=email], input[type=tel], select, textarea { padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--text); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand2); }
    textarea { resize: vertical; min-height: 72px; }
    button { border: 0; border-radius: 10px; padding: 9px 16px; background: var(--brand); color: #fff; font-weight: 700; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    button.red { background: var(--red); }
    button.sm { padding: 5px 11px; font-size: 12px; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .inline-link { color: var(--brand2); text-decoration: none; font-weight: 700; }
    .inline-link:hover { text-decoration: underline; }
    .error, .success { padding: 11px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; display: none; }
    .error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .empty { padding: 24px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); background: #f8fafc; text-align: center; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 13px; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; background: #f8fafc; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .actions { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .hidden { display: none !important; }

    /* Search bar */
    .search-bar { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-bar input { flex: 1; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 100; align-items: flex-start; justify-content: center; padding-top: 60px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; max-width: 580px; width: 100%; margin: 0 16px 60px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 18px; }
    .form-row { display: grid; gap: 12px; margin-bottom: 12px; }
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
    .form-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .form-group label { display: block; font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; }

    /* Client detail panel */
    .detail-panel { background: #eff6ff; border: 1px solid #dbeafe; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
    .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .detail-name { font-size: 20px; font-weight: 800; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
    .detail-label { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }

    /* Document mini-table */
    .doc-mini { font-size: 12px; }
    .doc-mini td { padding: 7px 8px; }

    @media (max-width: 700px) {
      .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      th, td { font-size: 12px; padding: 8px 6px; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="brand">Info<span>Experts</span> Clients</div>
      <div class="muted">Gestion des clients de facturation</div>
    </div>
    <div class="toolbar">
      <a class="inline-link" href="/admin/billing">Facturation</a>
      <a class="inline-link" href="/admin/calendar">Calendrier</a>
      <a class="inline-link" href="/admin">Dashboard</a>
    </div>
  </div>

  <div id="globalError" class="error"></div>
  <div id="globalSuccess" class="success"></div>

  <!-- Search + new -->
  <div class="search-bar">
    <input type="search" id="searchInput" placeholder="Recherche nom, email, société…" oninput="onSearchInput(this.value)">
    <button type="button" onclick="openCreateModal()">+ Nouveau client</button>
  </div>

  <!-- Client detail panel -->
  <div class="detail-panel hidden" id="detailPanel">
    <div class="detail-header">
      <div>
        <div class="detail-name" id="detailName">—</div>
        <div class="muted" id="detailCompany"></div>
      </div>
      <div class="actions">
        <button type="button" class="sm secondary" onclick="openEditModal(currentDetailId)">Modifier</button>
        <button type="button" class="sm" onclick="document.getElementById('detailPanel').classList.add('hidden')">Fermer</button>
      </div>
    </div>
    <div class="detail-grid">
      <div><div class="detail-label">Email</div><div id="detailEmail">—</div></div>
      <div><div class="detail-label">Téléphone</div><div id="detailPhone">—</div></div>
      <div><div class="detail-label">Adresse</div><div id="detailAddress">—</div></div>
      <div><div class="detail-label">Pays</div><div id="detailCountry">—</div></div>
    </div>
    <div style="margin-top:16px">
      <div style="font-weight:800;margin-bottom:8px;font-size:13px">Documents associés</div>
      <div id="detailDocs"><div class="muted">Chargement…</div></div>
    </div>
  </div>

  <!-- Table -->
  <div class="card panel">
    <div id="loadingState" class="empty">Chargement…</div>
    <div id="emptyState" class="empty hidden">Aucun client trouvé. Créez-en un avec "+ Nouveau client".</div>
    <div id="tableWrap" class="hidden">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Société</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Ville</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="clientTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- Edit / Create Modal -->
<div class="modal-overlay" id="clientModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Nouveau client</div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Nom affiché *</label><input type="text" id="fDisplayName" placeholder="Nom complet ou société"></div>
      <div class="form-group"><label>Société</label><input type="text" id="fCompany" placeholder="Nom de la société"></div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Prénom</label><input type="text" id="fFirstName"></div>
      <div class="form-group"><label>Nom de famille</label><input type="text" id="fLastName"></div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Email</label><input type="email" id="fEmail" placeholder="email@client.com"></div>
      <div class="form-group"><label>Téléphone</label><input type="tel" id="fPhone" placeholder="+269 …"></div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Adresse</label><input type="text" id="fAddress" placeholder="Adresse postale"></div>
      <div class="form-group"><label>Ville</label><input type="text" id="fCity" placeholder="Moroni"></div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Pays</label><input type="text" id="fCountry" value="Comores"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Notes internes</label><textarea id="fNotes" placeholder="Notes de suivi…"></textarea></div>
    </div>
    <input type="hidden" id="fClientId">
    <div id="modalError" class="error"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">
      <button type="button" class="secondary" onclick="closeModal()">Annuler</button>
      <button type="button" id="modalSaveBtn" onclick="saveClient()">Enregistrer</button>
      <button type="button" class="red sm hidden" id="modalDeleteBtn" onclick="deleteClient()">Supprimer</button>
    </div>
  </div>
</div>

<script>
  let allClients = [];
  let currentDetailId = null;

  function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function showError(msg) { const el = document.getElementById('globalError'); el.textContent = msg; el.style.display = 'block'; }
  function showSuccess(msg) { const el = document.getElementById('globalSuccess'); el.textContent = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 4000); }
  function clearMessages() { document.getElementById('globalError').style.display = 'none'; document.getElementById('globalSuccess').style.display = 'none'; }

  // ── Load clients ──────────────────────────────────────────────────────────────
  async function loadClients(search = '') {
    setLoading(true);
    try {
      const resp = await fetch(`/api/admin/billing?action=list-clients&search=${encodeURIComponent(search)}&limit=200`);
      if (resp.status === 401) { location.href = '/admin'; return; }
      const data = await resp.json();
      if (!data.success) throw new Error(data.error);
      allClients = data.clients || [];
      renderTable(allClients);
    } catch (err) {
      showError(err.message);
    } finally {
      setLoading(false);
    }
  }

  function renderTable(clients) {
    const tbody = document.getElementById('clientTableBody');
    const tableWrap = document.getElementById('tableWrap');
    const emptyState = document.getElementById('emptyState');

    if (!clients.length) {
      tableWrap.classList.add('hidden');
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');
    tableWrap.classList.remove('hidden');

    tbody.innerHTML = clients.map((c) => `<tr>
      <td>
        <a href="#" class="inline-link" onclick="showDetail('${esc(c.id)}');return false">${esc(c.display_name)}</a>
      </td>
      <td>${esc(c.company || '—')}</td>
      <td>${c.email ? `<a href="mailto:${esc(c.email)}" style="color:var(--brand2)">${esc(c.email)}</a>` : '—'}</td>
      <td>${esc(c.phone || '—')}</td>
      <td>${esc(c.city || '—')}</td>
      <td>
        <div class="actions">
          <button class="sm secondary" onclick="openEditModal('${esc(c.id)}')">Modifier</button>
          <a class="inline-link" href="/admin/billing?client=${c.id}" style="font-size:12px">Docs</a>
        </div>
      </td>
    </tr>`).join('');
  }

  // ── Client detail ─────────────────────────────────────────────────────────────
  async function showDetail(id) {
    currentDetailId = id;
    const client = allClients.find((c) => c.id === id);
    const panel = document.getElementById('detailPanel');
    panel.classList.remove('hidden');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

    if (client) {
      document.getElementById('detailName').textContent = client.display_name || '—';
      document.getElementById('detailCompany').textContent = client.company || '';
      document.getElementById('detailEmail').textContent = client.email || '—';
      document.getElementById('detailPhone').textContent = client.phone || '—';
      document.getElementById('detailAddress').textContent = [client.address, client.city].filter(Boolean).join(', ') || '—';
      document.getElementById('detailCountry').textContent = client.country || '—';
    }

    // Load documents
    document.getElementById('detailDocs').innerHTML = '<div class="muted" style="font-size:12px">Chargement…</div>';
    try {
      const resp = await fetch(`/api/admin/billing?action=list-documents&limit=20`);
      const data = await resp.json();
      if (!data.success) throw new Error(data.error);
      const docs = (data.documents || []).filter((d) => d.client_id === id || d.client_name === (client?.display_name || ''));
      if (!docs.length) {
        document.getElementById('detailDocs').innerHTML = '<div class="muted" style="font-size:12px">Aucun document.</div>';
        return;
      }
      const statusLabels = { draft:'Brouillon',ready:'Prêt',sent:'Envoyé',paid:'Payé',partial:'Partiel',overdue:'En retard',cancelled:'Annulé',accepted:'Accepté',expired:'Expiré',converted:'Converti' };
      document.getElementById('detailDocs').innerHTML = `<table class="doc-mini" style="width:100%">
        <thead><tr><th>N°</th><th>Type</th><th>Montant</th><th>Statut</th><th>Date</th></tr></thead>
        <tbody>${docs.map((d) => `<tr>
          <td><a class="inline-link" href="/admin/billing-edit?id=${d.id}">${esc(d.doc_number)}</a></td>
          <td>${esc({ invoice:'Facture', proforma:'Pro Forma', reminder:'Relance' }[d.doc_type] || d.doc_type)}</td>
          <td>${Number(d.total_kmf || 0).toLocaleString('fr-FR')} KMF</td>
          <td>${esc(statusLabels[d.status] || d.status)}</td>
          <td>${esc((d.issue_date || d.created_at || '').slice(0,10))}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    } catch (err) {
      document.getElementById('detailDocs').innerHTML = `<div class="muted" style="font-size:12px">Erreur : ${esc(err.message)}</div>`;
    }
  }

  // ── Modal ─────────────────────────────────────────────────────────────────────
  function openCreateModal() {
    clearModalForm();
    document.getElementById('modalTitle').textContent = 'Nouveau client';
    document.getElementById('modalDeleteBtn').classList.add('hidden');
    document.getElementById('fClientId').value = '';
    document.getElementById('clientModal').classList.add('open');
  }

  function openEditModal(id) {
    const client = allClients.find((c) => c.id === id);
    if (!client) return;
    clearModalForm();
    document.getElementById('modalTitle').textContent = 'Modifier client';
    document.getElementById('fClientId').value = client.id;
    document.getElementById('fDisplayName').value = client.display_name || '';
    document.getElementById('fFirstName').value = client.first_name || '';
    document.getElementById('fLastName').value = client.last_name || '';
    document.getElementById('fEmail').value = client.email || '';
    document.getElementById('fPhone').value = client.phone || '';
    document.getElementById('fCompany').value = client.company || '';
    document.getElementById('fAddress').value = client.address || '';
    document.getElementById('fCity').value = client.city || '';
    document.getElementById('fCountry').value = client.country || 'Comores';
    document.getElementById('fNotes').value = client.notes || '';
    document.getElementById('modalDeleteBtn').classList.remove('hidden');
    document.getElementById('clientModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('clientModal').classList.remove('open');
  }

  function clearModalForm() {
    ['fDisplayName','fFirstName','fLastName','fEmail','fPhone','fCompany','fAddress','fCity','fNotes'].forEach((id) => {
      document.getElementById(id).value = '';
    });
    document.getElementById('fCountry').value = 'Comores';
    document.getElementById('modalError').style.display = 'none';
  }

  async function saveClient() {
    const btn = document.getElementById('modalSaveBtn');
    const errEl = document.getElementById('modalError');
    btn.disabled = true;
    errEl.style.display = 'none';
    try {
      const payload = {
        id: document.getElementById('fClientId').value || undefined,
        displayName: document.getElementById('fDisplayName').value.trim(),
        firstName: document.getElementById('fFirstName').value.trim(),
        lastName: document.getElementById('fLastName').value.trim(),
        email: document.getElementById('fEmail').value.trim(),
        phone: document.getElementById('fPhone').value.trim(),
        company: document.getElementById('fCompany').value.trim(),
        address: document.getElementById('fAddress').value.trim(),
        city: document.getElementById('fCity').value.trim(),
        country: document.getElementById('fCountry').value.trim() || 'Comores',
        notes: document.getElementById('fNotes').value.trim(),
      };

      const resp = await fetch('/api/admin/billing?action=save-client', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!data.success) throw new Error(data.error);
      closeModal();
      showSuccess('Client enregistré.');
      loadClients();
    } catch (err) {
      errEl.textContent = err.message; errEl.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteClient() {
    const id = document.getElementById('fClientId').value;
    if (!id) return;
    if (!confirm('Supprimer ce client ? Ses documents resteront mais ne seront plus liés.')) return;
    try {
      const resp = await fetch('/api/admin/billing?action=delete-client', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id }),
      });
      const data = await resp.json();
      if (!data.success) throw new Error(data.error);
      closeModal();
      showSuccess('Client supprimé.');
      document.getElementById('detailPanel').classList.add('hidden');
      loadClients();
    } catch (err) {
      document.getElementById('modalError').textContent = err.message;
      document.getElementById('modalError').style.display = 'block';
    }
  }

  // ── Search ─────────────────────────────────────────────────────────────────────
  let searchTimeout = null;
  function onSearchInput(q) {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => loadClients(q), 300);
  }

  // ── Utils ──────────────────────────────────────────────────────────────────────
  function setLoading(on) {
    document.getElementById('loadingState').classList.toggle('hidden', !on);
    if (on) {
      document.getElementById('tableWrap').classList.add('hidden');
      document.getElementById('emptyState').classList.add('hidden');
    }
  }

  // ── Init ───────────────────────────────────────────────────────────────────────
  loadClients();
</script>
</body>
</html>
