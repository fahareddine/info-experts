<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyElite — Private Jets</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const MenuIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4" x2="20" y1="6" y2="6"/>
        <line x1="4" x2="20" y1="12" y2="12"/>
        <line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    );

    const XIcon = () => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 6 6 18"/>
        <path d="m6 6 12 12"/>
      </svg>
    );

    const NAV_LINKS = ["Start", "Story", "Rates", "Benefits", "FAQ"];
    const VIDEO_URL = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_091828_e240eb17-6edc-4129-ad9d-98678e3fd238.mp4";

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);

      return (
        <div className="min-h-screen bg-gray-50">
          <section className="relative h-screen overflow-hidden">

            {/* Video background */}
            <video
              autoPlay
              muted
              loop
              playsInline
              className="absolute inset-0 w-full h-full object-cover"
            >
              <source src={VIDEO_URL} type="video/mp4" />
            </video>

            {/* Light overlay for legibility */}
            <div className="absolute inset-0 bg-white/15" />

            {/* Content wrapper */}
            <div className="relative h-full flex flex-col">

              {/* ── Navigation ── */}
              <nav className="relative z-50">
                <div className="max-w-7xl mx-auto px-8 py-6 flex items-center justify-between">

                  {/* Brand */}
                  <span className="text-2xl font-semibold text-gray-900 select-none">
                    SkyElite
                  </span>

                  {/* Desktop links */}
                  <ul className="hidden md:flex items-center gap-8">
                    {NAV_LINKS.map((link) => (
                      <li key={link}>
                        <a
                          href="#"
                          className="text-gray-900 hover:text-gray-700 transition-colors text-sm font-medium"
                        >
                          {link}
                        </a>
                      </li>
                    ))}
                  </ul>

                  {/* Mobile hamburger */}
                  <button
                    onClick={() => setMenuOpen(!menuOpen)}
                    className="md:hidden text-gray-900 p-1 transition-colors hover:text-gray-700"
                    aria-label="Toggle menu"
                  >
                    {menuOpen ? <XIcon /> : <MenuIcon />}
                  </button>
                </div>

                {/* Mobile dropdown */}
                {menuOpen && (
                  <div className="md:hidden mx-4 mt-1 rounded-2xl bg-white/95 backdrop-blur-md shadow-xl border border-gray-100 overflow-hidden">
                    <ul className="py-3">
                      {NAV_LINKS.map((link) => (
                        <li key={link}>
                          <a
                            href="#"
                            onClick={() => setMenuOpen(false)}
                            className="block px-8 py-3 text-gray-900 hover:text-gray-700 hover:bg-gray-50 transition-colors text-sm font-medium"
                          >
                            {link}
                          </a>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
              </nav>

              {/* ── Hero content ── */}
              <main className="flex-1 flex items-center justify-center -mt-80">
                <div className="text-center px-4">

                  {/* Label */}
                  <p className="text-sm font-semibold text-gray-600 tracking-wider uppercase mb-4">
                    PRIVATE JETS
                  </p>

                  {/* Two-line heading with overlap */}
                  <div className="mb-6">
                    <h1 className="text-6xl md:text-7xl lg:text-8xl font-normal text-gray-500 leading-none tracking-tighter">
                      Premium.
                    </h1>
                    <h1
                      className="text-6xl md:text-7xl lg:text-8xl font-normal leading-none tracking-tighter"
                      style={{ color: '#202A36', marginTop: '-12px' }}
                    >
                      Accessible.
                    </h1>
                  </div>

                  {/* Subtitle */}
                  <p className="text-lg md:text-xl text-gray-600 mb-6 max-w-2xl mx-auto">
                    Your dedication deserves recognition.
                  </p>

                  {/* CTAs */}
                  <div className="flex items-center justify-center gap-4">
                    <button className="px-4 py-2 rounded-full bg-gray-300 text-gray-800 font-medium hover:bg-gray-400 transition-colors">
                      Discover
                    </button>
                    <button
                      className="px-4 py-2 rounded-full text-white font-medium transition-colors"
                      style={{ backgroundColor: '#202A36' }}
                      onMouseEnter={(e) => e.currentTarget.style.backgroundColor = '#1a2229'}
                      onMouseLeave={(e) => e.currentTarget.style.backgroundColor = '#202A36'}
                    >
                      Book Now
                    </button>
                  </div>

                </div>
              </main>

            </div>
          </section>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
